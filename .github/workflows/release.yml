name: release

# Publishes one binary per supported platform for a pushed tag, with checksums
# and a build provenance attestation. `go install` remains the primary install
# path; these artifacts are for hosts without a Go toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The cheapest question first: is this tag allowed to consume a release at
  # all. A lightweight tag or a version with no changelog section is a defect in
  # the tag, not in the code, and finding out after four gate runs, five builds,
  # and an attestation is finding out too late.
  contract:
    runs-on: ubuntu-latest
    # A job that has stopped making progress should fail fast rather than hold
    # a runner for the six-hour default. Sized to roughly twice observed
    # runtime.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag object itself has to be here, not just the commit it points
          # at, or the annotated-tag clause has nothing to read.
          fetch-depth: 0
      - run: sh release/tag-contract.sh --self-check
      - run: sh release/tag-contract.sh "${GITHUB_REF_NAME}"

  # A tag can point at any commit, including one CI never saw, so the suite runs
  # again here rather than trusting the branch build. It runs on every platform
  # this release ships a binary for: a published darwin artifact whose tests
  # never ran on darwin would be a platform claim nothing observed.
  gates:
    needs: contract
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - run: go vet ./...
      - run: go test ./... -race -count=1

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token the attestation is signed against
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # -trimpath and a pinned toolchain make the output depend on the source
      # and the tag alone, so a third party can rebuild these bytes. The tag is
      # the only input to the stamped version, so the binary cannot report a
      # version the release does not carry.
      #
      # One target per platform the gates job above ran green on this tag. A
      # binary for a platform no runner observed would be a claim the
      # release-decision record does not make, so the two lists move together.
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            [ "$os" = windows ] && suffix=".exe"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/0xkhdr/specd-cli/internal/cli.stampedVersion=${GITHUB_REF_NAME}" \
              -o "dist/specd_${os}_${arch}${suffix}" ./cmd/specd
          done
          cd dist && sha256sum specd_* > SHA256SUMS && cat SHA256SUMS

      # The host platform's own artifact is the only one this runner can run, so
      # it is the only one whose self-report is checked here. The rest are
      # covered by the per-platform gates job above.
      - name: built binary reports the tag
        run: |
          reported="$(./dist/specd_linux_amd64 --version)"
          echo "$reported"
          case "$reported" in
            "specd ${GITHUB_REF_NAME} "*) ;;
            *) echo "binary reports '$reported', expected version ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - name: attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/specd_*

      # The notes go through a file. Inlining a multi-line --notes argument
      # ends the YAML block scalar on the first unindented line, which makes
      # the whole workflow unparseable.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Lift this version's own section out of the changelog rather than
          # restating it here, so the release page and CHANGELOG.md cannot drift.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}"; exit 1
          fi
          cat >> release-notes.md <<EOF

          ---

          Verify a downloaded binary, naming the one you downloaded:

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify specd_linux_amd64 --repo ${GITHUB_REPOSITORY}
          \`\`\`

          Binaries are published for linux/amd64, linux/arm64, darwin/arm64,
          darwin/amd64, and windows/amd64. The loop itself is proven end to end
          on linux/amd64 only; see release/release-decision.md.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/specd_* dist/SHA256SUMS
